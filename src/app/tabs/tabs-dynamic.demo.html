<div style="padding: 20px 20px 0 20px;">
  <div class="row">
    <div class="inline">
      <button soho-button (click)="onAddTabPush()">Add Tab (Push)</button>
      <button soho-button (click)="onAddDisabledTabPush()">Add Disabled Tab (Push)</button>
      <button soho-button (click)="onAddHiddenTabPush()">Add Hidden Tab (Push)</button>
      <button soho-button (click)="onAddTabArray()">Add Tab (Array)</button>
      <button soho-button (click)="onAddDisabledTabArray()">Add Disabled Tab (Array)</button>
      <button soho-button (click)="onAddHiddenTabArray()">Add Hidden Tab (Array)</button>
    </div>
  </div>
  <div class="row top-padding">
    <div class="inline">
      <button soho-button (click)="onRemoveTab()">Remove Last Tab</button>
      <button soho-button (click)="onEnableTabs()">Enable Tabs</button>
      <button soho-button (click)="onShowTabs()">Show Hidden Tabs</button>
      <!-- <button soho-button (click)="onChangeTitles()">Change Titles</button> -->
    </div>
  </div>
</div>

<div class="row">
  <div class="twelve columns">

    <!-- Need to use attribute binding for tab states such as dismissible, disabled and hidden. This will be validated via mutation. -->
    <div soho-tabs registerForEvents="activated"
      (activated)="onActivated($event)"
      (activated)="onTabActivated($event)">
      <div soho-tab-list-container>
        <ul soho-tab-list>
          <li 
            [attr.dismissible]="tab.isDismissible === true ? true : null"
            [dismissible]="tab.isDismissible === true ? true : null"
            [attr.disabled]="tab.isDisabled === true ? true : null"
            [disabled]="tab.isDisabled === true ? true : null"
            [attr.hidden]="tab.isHidden === true ? true : null"
            [hidden]="tab.isHidden === true ? true : null"
            soho-tab *ngFor="let tab of tabs">
            <a soho-tab-title [tabId]="tab.id">{{tab.title}}</a>
          </li>
        </ul>
      </div>
    </div>

    <div soho-tab-panel-container>
      <div soho-tab-panel *ngFor="let tab of tabs; let i=index" [tabId]="tab.id">
        <p>{{tab.content}}
        </p>
      </div>
    </div>

  </div>
</div>
