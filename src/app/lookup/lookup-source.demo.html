<div class="row">
    <section class="six columns">
        <p>
            When a multiselect lookup gets data from a "source" function, the values should be selected in the lookup dialog.
        </p>
    </section>
</div>
<div class="row top-padding">
    <section class="twelve columns">
        <div class="field">
            <label soho-label for="the-dataset-lookup">Lookup with source</label>
            <input soho-lookup id="the-dataset-lookup" [(ngModel)]="model" [dataset]="dataset" [columns]="columns"
                field="productId" [multiselect]="true">
        </div>
        <div class="field">
            <label soho-label for="the-source-lookup">Lookup with async source</label>
            <input #asyncLookup soho-lookup id="the-source-lookup" [(ngModel)]="model" 
            [options]="{
              paging: true,
              pagesize: 5,
              pagesizes: [3, 5, 10, 15]
            }" 
            [source]="sourceAsync"
            [columns]="columns"
            field="productId"
            [multiselect]="true">
        </div>
    </section>
</div>
